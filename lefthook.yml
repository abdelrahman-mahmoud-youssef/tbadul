pre-commit:
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,mjs,css,json,md,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '{apps,packages}/**/*.{ts,tsx}'
      run: pnpm exec eslint {staged_files}

commit-msg:
  jobs:
    - run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - run: pnpm typecheck
    - run: pnpm test
